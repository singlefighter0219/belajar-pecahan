    <style>

            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fef9c3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1e293b;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);

            padding: 40px 30px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            border: 4px solid #ffffff;
        }
        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;

        }

            margin-bottom: 30px;
        }
        .menu-list {

            flex-direction: column;
            gap: 18px;
        }

            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            padding: 20px 24px;
            border-radius: 20px;
            transition: all 0.25s ease;
            text-align: left;
            border: 3px solid transparent;
        }
        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
        }
        .card-1 {
            background-color: #dbeafe;
            border-color: #60a5fa;
            color: #1e3a8a;
        }
        .card-2 {
            background-color: #fef08a;
            border-color: #facc15;
            color: #713f12;
        }
        .icon {
            font-size: 2.5rem;
            flex-shrink: 0;
        }
        .card-text h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 4px;
        }
        .card-text span {
            font-size: 0.95rem;
            opacity: 0.85;
            display: block;
        }
        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
